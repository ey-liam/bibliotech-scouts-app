name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxis JS de overlay y scripts
        run: |
          node --check web-overlay/native-early.js
          node --check web-overlay/native-bridge.js
          node --check scripts/sync-web.mjs

      - name: Copiar el sitio a www/ y verificar paquete limpio
        run: |
          npm run sync:web
          test ! -f www/native-test.html
          test ! -f www/native-mock.js

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar plataforma Android
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          chmod +x android/gradlew

      - name: Decodificar el keystore de publicación
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Compilar APK de prueba
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Compilar APK de publicación
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.ref_name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Guardar APK de prueba
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: bibliotech-scout-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Preparar APK y calcular huella SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk bibliotech-scout.apk
          sha256sum bibliotech-scout.apk > bibliotech-scout.apk.sha256
          cat bibliotech-scout.apk.sha256

      - name: Publicar release con APK y SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BiblioTech Scout ${{ github.ref_name }}
          files: |
            bibliotech-scout.apk
            bibliotech-scout.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
